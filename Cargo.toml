[package]
name = "fluid_universe"
version = "0.1.0"
edition = "2024"
publish = false
description = "Falsification-first fluid-universe research core, rewritten in Rust"

[lib]
name = "fluid_universe"
path = "src/lib.rs"

[[bin]]
name = "fluid-universe"
path = "src/main.rs"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
